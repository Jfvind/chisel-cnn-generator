name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scala:
    name: Scala and Chisel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt test
        working-directory: generator

  export:
    name: Export test parameters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt "runMain service.WeightExporter"
        working-directory: generator
      - uses: actions/upload-artifact@v7
        with:
          name: quantized-parameters
          path: generator/generated/quantized/*.csv
          if-no-files-found: error

  python:
    name: Python tests
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: quantized-parameters
          path: generator/generated/quantized
      - name: Install Python dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r python/requirements.txt
      - name: Prepare MNIST test data
        run: python -c "from torchvision.datasets import MNIST; MNIST('python/data', train=False, download=True)"
      - name: Python tests
        run: python -m unittest discover -s python/tests -t python
